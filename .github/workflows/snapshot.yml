name: Refresh snapshot

# Runs backend/snapshot_worker.py on a schedule and publishes its output as
# docs/snapshot.json, which GitHub Pages serves as a free static CDN — see
# backend/README's "Backend" section for what the worker itself does and
# why it needs no API keys. This is the piece that turns the app from
# "accurate as of whenever it was last built" into "accurate as of five
# minutes ago, indefinitely" — see the app's own Config.kt for the client
# side of this (SNAPSHOT_URL just has to point at this workflow's output).
#
# Every 5 minutes rather than the worker's own 1-minute design cadence:
# GitHub's scheduled-workflow cron is best-effort and can be delayed under
# load, so a 1-minute schedule wouldn't reliably fire every minute anyway.
# 5 minutes is the realistic floor, and the client's own polling (60s) just
# means it re-reads the same file a few times between real updates — no
# different, functionally, from any CDN-cached value.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {} # lets you trigger a run by hand from the Actions tab

permissions:
  contents: write # needed to commit state.json/snapshot.json back

concurrency:
  group: snapshot-refresh
  cancel-in-progress: false # let a run finish rather than racing its own commit

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # OurAirports' airports.csv turns bare ICAO codes into friendly
      # "City, ST" labels and gives the map real coordinates to drop pins
      # at — see backend/README's Backend section. Fetched once and
      # committed, not re-fetched every run: airport identities/coordinates
      # essentially never change, so there's no reason to make this a live
      # dependency of every single pass.
      - name: Fetch airports.csv (first run only)
        run: |
          if [ ! -f backend/airports.csv ]; then
            echo "airports.csv missing — downloading OurAirports' public export"
            curl -fsSL "https://davidmegginson.github.io/ourairports-data/airports.csv" -o backend/airports.csv
          else
            echo "airports.csv already present, skipping download"
          fi

      # GEMINI_API_KEY / GEMINI_NEWS_MODEL feed classify_news_themes() in
      # snapshot_worker.py — see that function's own doc comment. Both are
      # optional: leave either repo secret unset and this step still runs
      # exactly as before, just with no theme tags in this run's output
      # (classify_news_themes() logs why and returns nulls rather than
      # failing the pass). Add them under this repo's Settings -> Secrets
      # and variables -> Actions -> New repository secret.
      #
      # Google's Gemini API free tier is what this is built against —
      # genuinely free (no card on file, not a time-limited trial) with a
      # daily request quota this app's actual volume (a handful of tracked
      # people, refreshed every NEWS_EVERY passes — see that constant) sits
      # comfortably under. Get a key at aistudio.google.com/apikey.
      # GEMINI_NEWS_MODEL isn't actually sensitive (it's just a model name,
      # e.g. whichever current Gemini Flash/Flash-Lite model is listed at
      # ai.google.dev/gemini-api/docs/models under the free tier), but a
      # secret is the simplest place to put it since it's already the
      # mechanism this step needs for the real key.
      - name: Run snapshot_worker.py
        run: python3 backend/snapshot_worker.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_NEWS_MODEL: ${{ secrets.GEMINI_NEWS_MODEL }}

      - name: Publish to docs/ (what GitHub Pages serves)
        run: |
          mkdir -p docs
          cp backend/snapshot.json docs/snapshot.json

      - name: Commit updated state + published snapshot
        run: |
          git config user.name "snapshot-bot"
          git config user.email "actions@users.noreply.github.com"

          # Stash this run's freshly computed output somewhere a `git reset
          # --hard` below can't touch it. That reset is the point (see the
          # retry loop's comment) — this just makes sure the output survives it.
          mkdir -p /tmp/snapshot-out
          cp backend/state.json /tmp/snapshot-out/state.json
          cp backend/airports.csv /tmp/snapshot-out/airports.csv
          cp docs/snapshot.json /tmp/snapshot-out/snapshot.json

          # This job and ais.yml both run on the same 5-minute cron and both
          # push straight to main, and this workflow can also overlap with
          # itself (a manual workflow_dispatch landing close to a scheduled
          # run) — concurrency: only serializes runs of THIS workflow's
          # *jobs*, it doesn't stop a push from a still-in-flight run landing
          # on main in the gap between this run's checkout and its own push.
          #
          # The previous version of this loop handled that by rebasing this
          # run's one commit onto whatever just landed and retrying — fine
          # against ais.yml (which only ever touches backend/ais_cache.json,
          # so that rebase truly can't conflict), but wrong against another
          # snapshot.yml run: state.json/snapshot.json are wholesale
          # regenerated every pass, not incrementally edited, so two runs'
          # commits are two full-file rewrites of the same lines — a rebase
          # has to diff-and-replay one on the other and that's a real,
          # legitimate conflict (this is exactly what "CONFLICT (content):
          # Merge conflict in backend/state.json" was — not a bug in the
          # rebase, just the wrong tool for this data).
          #
          # There's no real merge to do here, though: this run's output is
          # already a complete, self-contained recomputation, so "newest
          # write wins" is always the correct resolution. So instead of
          # rebasing a diff, each retry resets straight onto the latest
          # main and re-stamps this run's already-computed files on top as
          # a fresh commit — an overwrite, not a merge, so there's nothing
          # left for git to conflict over.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            cp /tmp/snapshot-out/state.json backend/state.json
            cp /tmp/snapshot-out/airports.csv backend/airports.csv
            mkdir -p docs
            cp /tmp/snapshot-out/snapshot.json docs/snapshot.json

            git add backend/state.json backend/airports.csv docs/snapshot.json
            if git diff --cached --quiet; then
              echo "nothing changed against latest main, skipping commit"
              exit 0
            fi
            git commit -m "Refresh snapshot ($(date -u +%Y-%m-%dT%H:%M:%SZ))"

            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt/5) — another push landed first; re-syncing to latest main and re-stamping this run's output instead of rebasing"
            sleep $((RANDOM % 5 + 1))
          done
          echo "push still rejected after 5 retries — giving up this run; next scheduled run will retry"
          exit 1