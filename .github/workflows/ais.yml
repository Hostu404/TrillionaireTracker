      - name: Commit updated AIS cache
        run: |
          git config user.name "ais-bot"
          git config user.email "actions@users.noreply.github.com"
          # ais_listener.py only writes backend/ais_cache.json when a tracked
          # vessel's message actually arrives during the burst window — a
          # quiet burst (no AIS traffic heard for any tracked MMSI in 45s,
          # which is normal and expected, not an error) means the file never
          # gets created at all. `git add` on a nonexistent path fails the
          # whole job, so check first and treat "nothing heard" as the
          # ordinary no-op it is, same as an unpriced ticker just gets
          # skipped in snapshot_worker.py rather than failing that job.
          if [ ! -f backend/ais_cache.json ]; then
            echo "No AIS traffic heard for any tracked vessel this burst — nothing to commit."
            exit 0
          fi
          git add backend/ais_cache.json
          if git diff --cached --quiet; then
            echo "nothing changed, skipping commit"
          else
            git commit -m "Refresh AIS cache ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi