name: Refresh AIS cache

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ais-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install websockets
        run: pip install websockets

      - name: Burst-listen for AIS updates
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          AIS_BURST_SECONDS: "270"
        run: |
          if [ -z "$AISSTREAM_API_KEY" ]; then
            echo "AISSTREAM_API_KEY repo secret not set — skipping this run." \
                 "Get a free key at https://aisstream.io/authenticate and add it" \
                 "under Settings -> Secrets and variables -> Actions."
            exit 0
          fi
          python3 backend/ais_listener.py

      - name: Commit updated AIS cache
        run: |
          git config user.name "ais-bot"
          git config user.email "actions@users.noreply.github.com"
          # ais_listener.py only writes backend/ais_cache.json when a tracked
          # vessel's message actually arrives during the burst window — a
          # quiet burst (no AIS traffic heard for any tracked MMSI in the
          # listening window, which is normal and expected, not an error)
          # means the file never gets created at all. `git add` on a
          # nonexistent path fails the whole job, so check first and treat
          # "nothing heard" as the ordinary no-op it is, same as an unpriced ticker just gets
          # skipped in snapshot_worker.py rather than failing that job.
          if [ ! -f backend/ais_cache.json ]; then
            echo "No AIS traffic heard for any tracked vessel this burst — nothing to commit."
            exit 0
          fi

          # Stash this run's freshly heard AIS cache somewhere a `git reset
          # --hard` below can't touch it — see snapshot.yml's version of this
          # same loop for why it resets instead of rebasing.
          mkdir -p /tmp/ais-out
          cp backend/ais_cache.json /tmp/ais-out/ais_cache.json

          # This job and snapshot.yml both run on the same 5-minute cron and
          # both push straight to main, and this workflow can also overlap
          # with itself (a manual workflow_dispatch landing close to a
          # scheduled run) — concurrency: only serializes runs of THIS
          # workflow's *jobs*, it doesn't stop a push from a still-in-flight
          # run landing on main in the gap between this run's checkout and
          # its own push. Against snapshot.yml that gap is harmless (it never
          # touches backend/ais_cache.json), but two overlapping runs of THIS
          # workflow both rewrite that same file wholesale, and rebasing one
          # full rewrite onto another is a real conflict, not a bug in the
          # rebase — see snapshot.yml's incident for exactly this happening
          # to its own state.json/snapshot.json.
          #
          # This run's cache is already a complete, self-contained result of
          # its own burst window, so "newest write wins" is always correct —
          # there's no real merge to do. So instead of rebasing a diff, each
          # retry resets straight onto the latest main and re-stamps this
          # run's already-captured cache on top as a fresh commit — an
          # overwrite, not a merge, so there's nothing left for git to
          # conflict over.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            cp /tmp/ais-out/ais_cache.json backend/ais_cache.json

            git add backend/ais_cache.json
            if git diff --cached --quiet; then
              echo "nothing changed against latest main, skipping commit"
              exit 0
            fi
            git commit -m "Refresh AIS cache ($(date -u +%Y-%m-%dT%H:%M:%SZ))"

            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt/5) — another push landed first; re-syncing to latest main and re-stamping this run's output instead of rebasing"
            sleep $((RANDOM % 5 + 1))
          done
          echo "push still rejected after 5 retries — giving up this run; next scheduled run will retry"
          exit 1